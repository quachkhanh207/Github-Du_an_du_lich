<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Voice Chatbot Tester - Debug Flow</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; display: flex; gap: 20px; height: 100vh; box-sizing: border-box; margin: 0; }
        .panel { flex: 1; background: #2d2d2d; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
        h2 { margin-top: 0; color: #569cd6; border-bottom: 1px solid #444; padding-bottom: 10px; }
        #logBox { flex: 1; overflow-y: auto; background: #000; padding: 10px; font-size: 13px; border-radius: 5px; }
        .log-entry { margin-bottom: 8px; line-height: 1.4; border-bottom: 1px dashed #333; padding-bottom: 4px; }
        .log-time { color: #808080; }
        .log-type { font-weight: bold; }
        .type-tx { color: #ce9178; } /* Gửi đi */
        .type-rx { color: #4ec9b0; } /* Nhận về */
        .type-info { color: #dcdcaa; }
        .type-err { color: #f44747; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        button { background: #0e639c; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: bold; }
        button:hover { background: #1177bb; }
        button:disabled { background: #555; cursor: not-allowed; }
        #micBtn { background: #d16969; }
        #micBtn.listening { background: #f44747; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 1; } to { opacity: 0.6; } }
    </style>
</head>
<body>
    <div class="panel">
        <h2>🛠 Bảng Điều Khiển (Controls)</h2>
        <div class="controls">
            <button id="btnConnect" onclick="connectWs()">🔗 Kết Nối</button>
            <button id="btnDisconnect" onclick="disconnectWs()" disabled>❌ Ngắt Kết Nối</button>
        </div>
        <div class="controls">
            <button id="micBtn" onclick="toggleMic()" disabled>🎙 Nhấn Để Nói (Push-to-Talk)</button>
        </div>
        <div class="controls" style="margin-top:10px;">
            <input type="text" id="testTextInput" placeholder="Gõ câu hỏi text..." style="flex:1;padding:8px;background:#111;color:#fff;border:1px solid #444;border-radius:4px;" onkeydown="if(event.key==='Enter')sendTestText();">
            <button onclick="sendTestText()">Gửi Text</button>
        </div>
        <p><strong>Cơ chế Multimodal:</strong> 
            <br>- Bấm "Nhấn Để Nói" -> Nói -> Bấm lại để Gửi (hoặc gõ text).
            <br>- Server sinh Token Stream (chữ) & TTS Stream (giọng nói) đồng thời.
        </p>
    </div>

    <div class="panel" style="flex: 2;">
        <h2>📋 Luồng Hội Thoại (Logs)</h2>
        <div id="logBox"></div>
    </div>

    <script>
        let ws = null;
        let mediaRecorder = null;
        let audioStream = null;
        let isRecording = false;
        let fillerWait = null;
        let fillerUnclear = null;
        let fillerTimer = null;
        const logBox = document.getElementById("logBox");

        class AudioQueue {
            constructor() {
                this.queue = [];
                this.isPlaying = false;
                this.currentAudio = null;
            }
            enqueue(b64) {
                this.queue.push(b64);
                if (!this.isPlaying) this.playNext();
            }
            clear() {
                this.queue = [];
                if (this.currentAudio) {
                    try { this.currentAudio.pause(); } catch(e) {}
                    this.currentAudio = null;
                }
                this.isPlaying = false;
            }
            playNext() {
                if (this.queue.length === 0) {
                    this.isPlaying = false;
                    this.currentAudio = null;
                    return;
                }
                this.isPlaying = true;
                const b64 = this.queue.shift();
                try {
                    const binary = atob(b64);
                    const array = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) array[i] = binary.charCodeAt(i);
                    const blob = new Blob([array], { type: "audio/wav" });
                    const url = URL.createObjectURL(blob);
                    const audio = new Audio(url);
                    this.currentAudio = audio;
                    audio.onended = () => {
                        URL.revokeObjectURL(url);
                        this.playNext();
                    };
                    audio.onerror = () => {
                        URL.revokeObjectURL(url);
                        this.playNext();
                    };
                    audio.play().catch(e => {
                        console.warn("Audio play error:", e);
                        this.playNext();
                    });
                } catch(e) {
                    console.error("Audio queue error:", e);
                    this.playNext();
                }
            }
        }

        const audioQueue = new AudioQueue();

        function log(msg, type = "info", data = null) {
            const time = new Date().toLocaleTimeString();
            let html = `<div class="log-entry"><span class="log-time">[${time}]</span> `;
            
            let cls = "type-info";
            if(type === "TX") cls = "type-tx";
            if(type === "RX") cls = "type-rx";
            if(type === "ERR") cls = "type-err";

            html += `<span class="log-type ${cls}">[${type}]</span> ${msg}`;
            if(data) {
                const preview = JSON.stringify(data).substring(0, 150) + (JSON.stringify(data).length > 150 ? "..." : "");
                html += `<br><span style="color:#6a9955;font-size:11px;">${preview}</span>`;
            }
            html += `</div>`;
            logBox.innerHTML += html;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function connectWs() {
            if (ws) return;
            log("Đang kết nối tới ws://localhost:8000/ws...");
            ws = new WebSocket("ws://localhost:8000/ws");
            
            ws.onopen = () => {
                log("Đã kết nối thành công WebSocket!", "info");
                document.getElementById("btnConnect").disabled = true;
                document.getElementById("btnDisconnect").disabled = false;
                document.getElementById("micBtn").disabled = false;
            };

            ws.onmessage = async (event) => {
                const payload = JSON.parse(event.data);
                log(`Nhận tín hiệu: ${payload.type}`, "RX", payload);

                if (payload.type === "filler") {
                    if (payload.id === "filler_wait" || payload.id === "wait") fillerWait = payload.audio;
                    else if (payload.id === "filler_unclear" || payload.id === "unclear") fillerUnclear = payload.audio;
                } else if (payload.type === "transcript") {
                    // STT xong, đang chờ LLM phản hồi
                } else if (payload.type === "tts_chunk" && payload.audio) {
                    clearTimeout(fillerTimer);
                    audioQueue.enqueue(payload.audio);
                } else if (payload.type === "stt_empty") {
                    clearTimeout(fillerTimer);
                    if (fillerUnclear) {
                        log("Phát audio: Không nghe rõ", "info");
                        audioQueue.enqueue(fillerUnclear);
                    }
                } else if (payload.type === "done") {
                    clearTimeout(fillerTimer);
                }
            };

            ws.onclose = () => {
                log("Đã ngắt kết nối WebSocket", "ERR");
                ws = null;
                document.getElementById("btnConnect").disabled = false;
                document.getElementById("btnDisconnect").disabled = true;
                document.getElementById("micBtn").disabled = true;
                if(isRecording) toggleMic();
            };
            
            ws.onerror = (e) => {
                log("Lỗi WebSocket", "ERR", e);
            };
        }

        function disconnectWs() {
            if(ws) {
                ws.close();
            }
        }

        function sendMsg(payload) {
            if(!ws || ws.readyState !== WebSocket.OPEN) {
                log("Không thể gửi, WebSocket chưa mở", "ERR");
                return;
            }
            log(`Gửi tín hiệu: ${payload.type}`, "TX", payload);
            ws.send(JSON.stringify(payload));
        }

        async function toggleMic() {
            if(!isRecording) {
                try {
                    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });
                    
                    audioQueue.clear();
                    clearTimeout(fillerTimer);
                    sendMsg({ type: "audio_start" });
                    
                    mediaRecorder.ondataavailable = async (e) => {
                        if (e.data.size > 0) {
                            const buffer = await e.data.arrayBuffer();
                            const base64Audio = btoa(String.fromCharCode(...new Uint8Array(buffer)));
                            sendMsg({ type: "audio_chunk", data: base64Audio });
                        }
                    };

                    mediaRecorder.start(500); // Lấy chunk mỗi 500ms
                    isRecording = true;
                    document.getElementById("micBtn").textContent = "🛑 Kết Thúc Nói";
                    document.getElementById("micBtn").classList.add("listening");
                    log("Đã bật Mic, đang gửi audio_chunk...", "info");
                } catch(e) {
                    log("Lỗi truy cập Mic", "ERR", e);
                }
            } else {
                mediaRecorder.stop();
                audioStream.getTracks().forEach(t => t.stop());
                isRecording = false;
                
                document.getElementById("micBtn").textContent = "🎙 Nhấn Để Nói";
                document.getElementById("micBtn").classList.remove("listening");
                
                // Gửi cờ audio_end sau khi flush chunk cuối (delay nhẹ)
                setTimeout(() => {
                    sendMsg({ type: "audio_end", enable_tts: true });

                    // Bắt đầu đếm 1.2s chờ LLM, nếu chưa có câu trả lời thì phát câu đệm giữ chân
                    clearTimeout(fillerTimer);
                    fillerTimer = setTimeout(() => {
                        if (fillerWait) {
                            log("Đang phát audio đệm (Filler): Dạ vâng, anh chị chờ em một chút nhé...", "info");
                            audioQueue.enqueue(fillerWait);
                        }
                    }, 1200);
                }, 600);
            }
        }

        function sendTestText() {
            const inp = document.getElementById("testTextInput");
            const txt = (inp.value || "").trim();
            if (!txt) return;
            inp.value = "";
            audioQueue.clear();
            sendMsg({ type: "text", text: txt, enable_tts: true });
        }
    </script>
</body>
</html>
